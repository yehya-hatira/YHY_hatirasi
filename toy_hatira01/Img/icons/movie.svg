<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 电影票外框 -->
  <rect x="3" y="6" width="18" height="12" rx="1.5"/>
  
  <!-- 左侧齿孔 -->
  <circle cx="3" cy="9" r="0.8" fill="#ffffff"/>
  <circle cx="3" cy="12" r="0.8" fill="#ffffff"/>
  <circle cx="3" cy="15" r="0.8" fill="#ffffff"/>
  
  <!-- 右侧齿孔 -->
  <circle cx="21" cy="9" r="0.8" fill="#ffffff"/>
  <circle cx="21" cy="12" r="0.8" fill="#ffffff"/>
  <circle cx="21" cy="15" r="0.8" fill="#ffffff"/>
  
  <!-- 中间虚线分割 -->
  <path d="M12 6v12" stroke-dasharray="1.5 1.5" opacity="0.5"/>
  
  <!-- 左侧电影胶片图标 -->
  <rect x="6" y="9" width="4" height="6" rx="0.5"/>
  <line x1="6" y1="10.5" x2="10" y2="10.5" opacity="0.3"/>
  <line x1="6" y1="12" x2="10" y2="12" opacity="0.3"/>
  <line x1="6" y1="13.5" x2="10" y2="13.5" opacity="0.3"/>
  
  <!-- 右侧播放按钮 -->
  <circle cx="16.5" cy="12" r="2.5"/>
  <path d="M15.5 10.5l3 1.5-3 1.5z" fill="#ffffff"/>
  
  <!-- 票面文字线条 -->
  <line x1="14" y1="9" x2="19" y2="9" opacity="0.4" stroke-width="1"/>
  <line x1="14" y1="15" x2="18" y2="15" opacity="0.4" stroke-width="1"/>
</svg>