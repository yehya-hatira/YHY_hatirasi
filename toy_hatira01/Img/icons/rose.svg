<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 左侧大花瓣 -->
  <path d="M8 8 Q7 6, 8 4 Q9 3, 10 4 L10 8"/>
  
  <!-- 右侧大花瓣 -->
  <path d="M16 8 Q17 6, 16 4 Q15 3, 14 4 L14 8"/>
  
  <!-- 花朵底部 -->
  <path d="M10 8 Q12 9, 14 8"/>
  
  <!-- 中心螺旋 -->
  <circle cx="12" cy="3.5" r="0.8"/>
  <path d="M12 2.7 Q13 3, 13 4"/>
  
  <!-- 花茎 -->
  <line x1="12" y1="8" x2="12" y2="22"/>
  
  <!-- 左侧叶子外轮廓 -->
  <path d="M12 12 Q16 12, 7 13 Q16 14, 12 14"/>
  <!-- 左侧叶子叶脉 -->
  <line x1="12" y1="12" x2="8" y2="13" stroke-width="0.8" opacity="0.6"/>
  <path d="M9 12.5 Q8.5 13, 9 13.5" stroke-width="0.8" opacity="0.6"/>
  
  <!-- 右侧叶子外轮廓 -->
  <path d="M12 12 Q16 12, 17 13 Q16 14, 12 14"/>
  <!-- 右侧叶子叶脉 -->
  <line x1="12" y1="12" x2="16" y2="13" stroke-width="0.8" opacity="0.6"/>
  <path d="M15 12.5 Q15.5 13, 15 13.5" stroke-width="0.8" opacity="0.6"/>
  
  <!-- 底部小叶子外轮廓 -->
  <path d="M12 18 Q9 18, 8.5 19 Q9 20, 12 19.5"/>
  <!-- 底部小叶子叶脉 -->
  <line x1="12" y1="18" x2="9.5" y2="19" stroke-width="0.8" opacity="0.6"/>
  
  <!-- 花茎上的小点（连接处） -->
  <circle cx="12" cy="8" r="0.5" fill="#ffffff"/>
  <circle cx="12" cy="12" r="0.5" fill="#ffffff"/>
  <circle cx="12" cy="18" r="0.5" fill="#ffffff"/>
  <circle cx="12" cy="22" r="0.5" fill="#ffffff"/>
</svg>